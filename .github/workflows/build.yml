name: build and publish

# The image is built here rather than on a workstation or a rented GPU for three
# reasons: Actions is free on a public repository, GHCR egress from Actions is
# not metered, and the multi-architecture CUDA compile needs no GPU -- only nvcc.
on:
  push:
    branches: [main]
    paths: ['Dockerfile', 'pins.env', 'tools/**', 'workflows/**', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A CUDA runtime plus torch does not fit in the default free space.
      - name: reclaim disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          docker image prune -af
          df -h /

      - name: load pins
        # GITHUB_ENV takes NAME=value lines only -- it rejects the comments and
        # blank lines that make pins.env readable, so filter to assignments.
        run: grep -E '^[A-Z][A-Z0-9_]*=' pins.env >> "$GITHUB_ENV"

      - name: build
        run: |
          docker build \
            --build-arg BASE_DEVEL="$BASE_DEVEL" \
            --build-arg BASE_RUNTIME="$BASE_RUNTIME" \
            --build-arg TORCH_CHANNEL="$TORCH_CHANNEL" \
            --build-arg TORCH_VERSION="$TORCH_VERSION" \
            --build-arg COMFYUI_REPO="$COMFYUI_REPO" \
            --build-arg COMFYUI_SHA="$COMFYUI_SHA" \
            -t local/comfy-i2v-env:candidate .

      # The gate. A public image cannot be un-published, so the scan runs before
      # the push, not after it, and a finding fails the job.
      - name: scan for anything identifying
        env:
          PRIVATE_STRINGS_CONTENT: ${{ secrets.PRIVATE_STRINGS }}
        run: |
          mkdir -p ~/.config/comfy-i2v-env
          printf '%s\n' "$PRIVATE_STRINGS_CONTENT" > ~/.config/comfy-i2v-env/private-strings
          chmod 600 ~/.config/comfy-i2v-env/private-strings
          # The secret is optional, and its absence must be loud rather than
          # silent: a skipped check reads exactly like a passed one otherwise.
          # Count real entries -- an unset secret still writes a newline, so a
          # -s test on the file says "set" and the warning never fires.
          ENTRIES=$(grep -cvE '^[[:space:]]*(#|$)' ~/.config/comfy-i2v-env/private-strings || true)
          echo "private-string entries available to the scan: $ENTRIES"
          if [ "$ENTRIES" -eq 0 ]; then
            echo "> **Identity checks skipped** -- the PRIVATE_STRINGS secret is not set." >> "$GITHUB_STEP_SUMMARY"
            echo "> Structural checks (credentials, VCS metadata, shell history) still ran." >> "$GITHUB_STEP_SUMMARY"
          fi
          ./tools/scan-image.sh local/comfy-i2v-env:candidate

      # A second gate, and a different kind from the scan above. The scan asks
      # whether the image is safe to publish; this asks whether it works at all.
      # ComfyUI booting and serving its own node schema is the cheapest proof
      # that the pins resolved to something that runs -- no GPU, no weights, no
      # rented hardware. The schema is also the ground truth any workflow has to
      # be checked against, so it is published as an artifact.
      - name: boot on CPU and capture the node schema
        run: ./tools/dump-object-info.sh local/comfy-i2v-env:candidate object-info.json

      - name: record what produced the schema
        run: |
          {
            echo "### Node schema"
            echo ""
            echo "- classes: $(python3 -c 'import json;print(len(json.load(open("object-info.json"))))')"
            echo "- sha256: $(sha256sum object-info.json | cut -d' ' -f1)"
            echo "- ComfyUI: ${COMFYUI_RELEASE} (${COMFYUI_SHA})"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: object-info
          path: |
            object-info.json
            object-info-system.json

      - name: log in to ghcr
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: push
        run: |
          REF="ghcr.io/${{ github.repository_owner }}/comfy-i2v-env"
          docker tag local/comfy-i2v-env:candidate "$REF:${COMFYUI_RELEASE}-${TORCH_CHANNEL}"
          docker tag local/comfy-i2v-env:candidate "$REF:latest"
          docker push "$REF:${COMFYUI_RELEASE}-${TORCH_CHANNEL}"
          docker push "$REF:latest"
          echo "published $REF:${COMFYUI_RELEASE}-${TORCH_CHANNEL}" >> "$GITHUB_STEP_SUMMARY"
